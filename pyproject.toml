[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vetra"
version = "1.1.0"
description = "Directional wave spectra at a fixed point from wind histories"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Leandro Farina" }]
requires-python = ">=3.10"
dependencies = ["numpy", "torch>=2.0"]

[tool.setuptools]
packages = ["vetra"]
